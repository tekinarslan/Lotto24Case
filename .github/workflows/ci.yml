name: CI Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # Android & Shared Multiplatform Job
  # ==========================================
  android-build-and-test:
    name: Android Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Shared Unit Tests
        run: ./gradlew :shared:testAndroidHostTest --stacktrace

      - name: Verify Screenshot Regression Tests (Roborazzi)
        run: ./gradlew :androidApp:verifyRoborazziDebug --stacktrace

      - name: Assemble Android Debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-unit-test-results
          path: shared/build/test-results/testAndroidHostTest/
          retention-days: 7

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
          retention-days: 7

  # ==========================================
  # iOS Multiplatform Framework & Native App Job
  # ==========================================
  ios-build:
    name: iOS Framework & Simulator App Build
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Verify Xcode Version
        run: xcodebuild -version

      - name: Compile Shared Multiplatform Framework for iOS Simulator
        run: ./gradlew :shared:compileKotlinIosSimulatorArm64 --stacktrace

      - name: Build Native iOS Simulator App (Code Signing Disabled)
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
