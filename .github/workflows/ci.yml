name: CI Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # Step 1: Prerequisite Gate - Shared Unit Tests
  # ==========================================
  shared-unit-tests:
    name: 1. Shared Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Shared Multiplatform Unit Tests
        run: ./gradlew :shared:testAndroidHostTest --stacktrace

      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-unit-test-results
          path: shared/build/test-results/testAndroidHostTest/
          retention-days: 7

  # ==========================================
  # Step 2: Roborazzi Screenshot Regression Tests
  # ==========================================
  screenshot-tests:
    name: 2. Roborazzi Screenshot Tests
    needs: [shared-unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Verify Screenshot Regression Tests
        run: ./gradlew :androidApp:verifyRoborazziDebug --stacktrace

  # ==========================================
  # Step 3a: Parallel Build - Android Debug APK
  # ==========================================
  build-android-apk:
    name: 3a. Build Android APK
    needs: [screenshot-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Assemble Android Debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
          retention-days: 7

  # ==========================================
  # Step 3b: Parallel Build - iOS Simulator App
  # ==========================================
  build-ios-app:
    name: 3b. Build iOS App
    needs: [screenshot-tests]
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Verify Xcode Version
        run: xcodebuild -version

      - name: Compile Shared Multiplatform Framework for iOS Simulator
        run: ./gradlew :shared:compileKotlinIosSimulatorArm64 --stacktrace

      - name: Build Native iOS Simulator App (Code Signing Disabled)
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            clean build
